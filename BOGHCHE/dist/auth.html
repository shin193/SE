<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#536144"><meta name="description" content="ورود، ثبت‌نام و بازیابی رمز حساب بقچه"><title>ورود و ثبت‌نام | بقچه</title>
<link rel="icon" href="assets/favicon.svg"><link rel="preload" href="assets/vazirmatn.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="features.css"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="auth-polish.css"><script src="theme.js"></script><script src="auth-client.js" defer></script><script src="auth.js" defer></script>
</head>
<body class="auth-body">
<a class="skip-link" href="#auth-form">رفتن به فرم</a>
<header class="auth-header"><a class="brand" href="index.html" aria-label="بقچه، بازگشت به فروشگاه"><span class="brand-mark" aria-hidden="true">✳</span><span><b>بقچه</b></span></a><a class="back-store" href="index.html">بازگشت به فروشگاه <span aria-hidden="true">↖</span></a></header>
<main class="auth-shell">

<ellipse cx="72" cy="128" rx="34" ry="5" fill="var(--olive)" opacity=".1"/>

<g class="spool-wave"><path d="M101 64Q116 63 117 44" fill="none" stroke="var(--dark)" stroke-width="4" stroke-linecap="round"/><path d="M112 45Q108 33 112 32L116 38Q115 24 119 25L120 37Q124 27 126 30L123 40Q131 34 131 38L126 47Q119 53 114 47Z" fill="var(--cream)" stroke="var(--olive)" stroke-width="1.6" stroke-linejoin="round"/></g>

<path d="M38 102Q70 111 103 102L103 110Q70 121 38 110Z" fill="var(--cream)" stroke="var(--olive)" stroke-width="1.5"/>
<path d="M55 63Q60 59 64 62M78 62Q83 59 87 63" fill="none" stroke="var(--dark)" stroke-width="2" stroke-linecap="round"/>

<path d="M96 98Q118 105 110 114" fill="none" stroke="var(--rust)" stroke-width="1.8" stroke-linecap="round"/></g></svg></div></div>
  <div class="auth-tabs" role="tablist" aria-label="انتخاب فرم"><span class="tab-seam" aria-hidden="true"></span><button id="login-tab" role="tab" aria-selected="true" aria-controls="auth-content" data-mode="login">ورود</button><button id="signup-tab" role="tab" aria-selected="false" aria-controls="auth-content" tabindex="-1" data-mode="signup">ثبت‌نام</button></div>
  <p class="auth-demo" id="auth-disclosure"><span aria-hidden="true">◌</span> حالت نمایشی؛ حساب یا ورود واقعی انجام نمی‌شود.</p>
  <div id="auth-content" role="tabpanel" aria-labelledby="login-tab">
  <form id="auth-form" method="post" novalidate>
   <div class="auth-field" id="name-field" hidden><label for="auth-name">نام و نام خانوادگی</label><div class="input-wrap"><input id="auth-name" name="displayName" type="text" maxlength="60" autocomplete="name" placeholder="مثلاً نگار احمدی" aria-describedby="name-error"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span></div><span class="field-error" id="name-error" aria-live="polite"></span></div>
   <div class="auth-field"><label for="auth-email">ایمیل</label><div class="input-wrap"><input id="auth-email" name="email" type="email" maxlength="254" autocomplete="username" dir="ltr" placeholder="you@example.com" required aria-describedby="email-error"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span></div><span class="field-error" id="email-error" aria-live="polite"></span></div>
   <div class="auth-field" id="password-field"><label for="auth-password">رمز عبور</label><div class="password-wrap"><input id="auth-password" name="password" type="password" autocomplete="current-password" required maxlength="128" aria-describedby="password-hint password-error"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><button class="show-password" type="button" data-reveal="auth-password" aria-controls="auth-password" aria-pressed="false" aria-label="نمایش رمز عبور">نمایش</button></div><small id="password-hint" hidden>دست‌کم ۸ نویسه، شامل حرف و عدد.</small><span class="field-error" id="password-error" aria-live="polite"></span></div>
   <div class="auth-field" id="confirm-field" hidden><label for="auth-confirm">تکرار رمز عبور</label><div class="password-wrap"><input id="auth-confirm" name="confirmPassword" type="password" autocomplete="new-password" maxlength="128" aria-describedby="confirm-error" disabled><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-7 8 2 2 4-4"/></svg></span><button class="show-password" type="button" data-reveal="auth-confirm" aria-controls="auth-confirm" aria-pressed="false" aria-label="نمایش تکرار رمز عبور">نمایش</button></div><span class="field-error" id="confirm-error" aria-live="polite"></span></div>
   <div class="login-options" id="login-options"><label><input id="remember" type="checkbox" name="remember"> مرا به خاطر بسپار</label><a id="forgot-link" href="auth.html?mode=forgot">فراموشی رمز عبور</a></div>
   <button type="submit" class="auth-submit" disabled><span id="submit-label">بررسی ورود</span><svg class="button-seam" preserveAspectRatio="none" viewBox="0 0 400 56" aria-hidden="true"><rect x="5" y="5" width="390" height="46" rx="7" pathLength="100"/></svg><span class="loading-needle" aria-hidden="true">⌁</span></button>
   <div class="auth-feedback" id="auth-status" role="status" aria-live="polite" tabindex="-1"><svg class="success-thread" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 25 19 36 40 12" pathLength="100"/></svg><span id="status-text"></span></div>
  </form>
  </div>
 </section>
 <aside class="sewing-scene" aria-label="تصویر چرخ خیاطی">

   <defs><pattern id="linen" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 1H6M1 0V6" stroke="currentColor" stroke-opacity=".08" stroke-width=".5"/></pattern><pattern id="gingham" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="var(--paper)"/><path d="M0 8H32M8 0V32" stroke="var(--olive)" stroke-opacity=".22" stroke-width="16"/></pattern></defs>

 </aside>
</main><footer class="auth-footer">بقچه <span>نسخهٔ نمایشی احراز هویت</span></footer>
