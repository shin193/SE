  <div id="auth-content" role="tabpanel" aria-labelledby="login-tab">
  <form id="auth-form" method="post" novalidate>
   <div class="auth-field" id="name-field" hidden><label for="auth-name">نام و نام خانوادگی</label><div class="input-wrap"><input id="auth-name" name="displayName" type="text" maxlength="60" autocomplete="name" placeholder="مثلاً نگار احمدی" aria-describedby="name-error"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span></div><span class="field-error" id="name-error" aria-live="polite"></span></div>
   <div class="auth-field"><label for="auth-email">ایمیل</label><div class="input-wrap"><input id="auth-email" name="email" type="email" maxlength="254" autocomplete="username" dir="ltr" placeholder="you@example.com" required aria-describedby="email-error"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span></div><span class="field-error" id="email-error" aria-live="polite"></span></div>
   <div class="auth-field" id="password-field"><label for="auth-password">رمز عبور</label><div class="password-wrap"><input id="auth-password" name="password" type="password" autocomplete="current-password" required maxlength="128" aria-describedby="password-hint password-error"><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><button class="show-password" type="button" data-reveal="auth-password" aria-controls="auth-password" aria-pressed="false" aria-label="نمایش رمز عبور">نمایش</button></div><small id="password-hint" hidden>دست‌کم ۸ نویسه، شامل حرف و عدد.</small><span class="field-error" id="password-error" aria-live="polite"></span></div>
   <div class="auth-field" id="confirm-field" hidden><label for="auth-confirm">تکرار رمز عبور</label><div class="password-wrap"><input id="auth-confirm" name="confirmPassword" type="password" autocomplete="new-password" maxlength="128" aria-describedby="confirm-error" disabled><span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-7 8 2 2 4-4"/></svg></span><button class="show-password" type="button" data-reveal="auth-confirm" aria-controls="auth-confirm" aria-pressed="false" aria-label="نمایش تکرار رمز عبور">نمایش</button></div><span class="field-error" id="confirm-error" aria-live="polite"></span></div>
   <div class="login-options" id="login-options"><label><input id="remember" type="checkbox" name="remember"> مرا به خاطر بسپار</label><a id="forgot-link" href="auth.html?mode=forgot">فراموشی رمز عبور</a></div>
   <button type="submit" class="auth-submit" disabled><span id="submit-label">بررسی ورود</span><svg class="button-seam" preserveAspectRatio="none" viewBox="0 0 400 56" aria-hidden="true"><rect x="5" y="5" width="390" height="46" rx="7" pathLength="100"/></svg><span class="loading-needle" aria-hidden="true">⌁</span></button>

  </form>
